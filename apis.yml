name: Arena AI
description: 'Arena AI (now operating as Arena Physica) is a New York-headquartered applied-research
  company building what it calls "electromagnetic superintelligence." Its flagship product, Atlas, is an
  AI-powered hardware-engineering platform that pairs general intelligence with deterministic physics
  models to accelerate the design, verification, and debugging of electronic and RF hardware. Atlas
  ingests telemetry, schematics, CAD files, and firmware, then connects via API or MCP (Model Context
  Protocol) to engineering toolchains such as Jira, GitHub, Altium, Cadence, and SPICE simulators, and
  to test equipment from vendors like Keysight and Tektronix. Atlas RF Studio, the company''s RF design
  tool, is currently in beta. The company operates from New York City (HQ), San Francisco, and Los
  Angeles.'
